# Base values shared by local and production. Environment-specific overrides
# live in values-local.yaml / values-prod.yaml — see docs/02-architecture.md
# for what differs and why.

global:
  ingress:
    className: traefik
  # Label that marks a pod as an MCP client allowed through the MCP servers'
  # NetworkPolicies. Set on gateway pods; shared by both subcharts.
  mcpClientLabel: urumi.ai/mcp-client

# WordPress + WooCommerce + MySQL + the store's WooCommerce MCP server.
# Every key under here is passed to the store subchart - see
# charts/store/values.yaml for the full list and defaults.
store:
  enabled: true

# Gateway + its Postgres. See charts/gateway/values.yaml for every key.
gateway:
  enabled: true

dashboard:
  enabled: false # becomes true in Phase 4
