# Overrides for local k3d. Merge with: helm install ... -f values.yaml -f values-local.yaml
global:
  networkPolicy:
    # k3d's single node, where the API server listens (kubectl get endpoints
    # kubernetes). Changes if the cluster is recreated.
    apiServerCidr: 172.18.0.3/32
    # Lets a Prometheus in the `monitoring` namespace scrape the gateway's /metrics.
    metricsScrape:
      enabled: true
      namespace: monitoring
      podLabels:
        app.kubernetes.io/name: prometheus

store:
  ingress:
    host: store.local.test
  storageClassName: local-path

gateway:
  gateway:
    # The chat agent's model searches for tools instead of receiving all 57
    # (fewer tokens per turn on the free tier); MCP clients still get the full list.
    search:
      chatMode: "on"
    # Search mode adds a model step before each tool call, and the Gemini free tier
    # answers in ~10-15 s per step, so a prompt that needs two upstreams can pass 90 s.
    chat:
      turnTimeoutMs: 180000
    ssrf:
      # Test fixture only: the live suites register a black-hole upstream here
      # to prove a hanging server can't slow anything else down.
      allowedHosts: ["10.255.255.1"]
  ingress:
    host: gateway.local.test
  storageClassName: local-path
  dashboardUrl: http://dashboard.local.test # http locally: no Secure cookie flag
  seedWoocommerce:
    storeUrl: http://store.local.test
  # Multi-store: stores at <slug>.store.local.test. /etc/hosts has no wildcards,
  # so scripts/verify-phase10.sh prints the line to add for each new store.
  stores:
    enabled: true
    template:
      baseDomain: store.local.test
      storageClassName: local-path
  # Hosted MCP servers (needs stores.enabled: the provisioner builds them).
  # The bridge image is built locally and imported into k3d.
  hosted:
    enabled: true
    imageAllowlist:
      - docker.io/mcp/
      # This repo's own images (imported into k3d), e.g. woocommerce-mcp as an
      # http server in scripts/verify-hosted.sh.
      - docker.io/mcp-gateway/

dashboard:
  ingress:
    host: dashboard.local.test
