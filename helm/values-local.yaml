# Overrides for local k3d. Merge with: helm install ... -f values.yaml -f values-local.yaml
store:
  ingress:
    host: store.local.test
  storageClassName: local-path

gateway:
  gateway:
    ssrf:
      # Test fixture only: the live suites register a black-hole upstream here
      # to prove a hanging server can't slow anything else down.
      allowedHosts: ["10.255.255.1"]
  ingress:
    host: gateway.local.test
  storageClassName: local-path
  dashboardUrl: http://dashboard.local.test # http locally: no Secure cookie flag

dashboard:
  ingress:
    host: dashboard.local.test
