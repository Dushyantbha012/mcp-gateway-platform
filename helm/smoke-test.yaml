# One-off smoke test for Phase 1 — proves k3d -> Traefik -> Ingress ->
# Service -> Pod works end to end before any real app is built on it.
# Not part of the Helm chart; apply/delete directly with kubectl:
#   kubectl apply -f helm/smoke-test.yaml
#   kubectl delete -f helm/smoke-test.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-test
  template:
    metadata:
      labels:
        app: smoke-test
    spec:
      containers:
        - name: hello
          image: nginxdemos/hello:plain-text
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-test
spec:
  selector:
    app: smoke-test
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smoke-test
spec:
  ingressClassName: traefik
  rules:
    - host: dashboard.local.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smoke-test
                port:
                  number: 80
    - host: store.local.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smoke-test
                port:
                  number: 80
    - host: gateway.local.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smoke-test
                port:
                  number: 80
