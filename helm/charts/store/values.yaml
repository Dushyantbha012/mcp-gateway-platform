# Defaults for one WooCommerce store. Environment-specific values (ingress
# host, storage class, TLS) are set from the umbrella chart's
# values-local.yaml / values-prod.yaml under the `store:` key.

# Secrets are never generated by this chart - they're created ahead of time
# by scripts/create-secrets.sh so that `helm uninstall` can't delete a
# password the MySQL volume still depends on. These are the Secret names.
secrets:
  db: store-db # keys: root-password, password
  admin: store-admin # keys: username, password, email
  wcApi: store-wc-api # keys: consumer-key, consumer-secret
  mcpAuth: woocommerce-mcp-auth # keys: token

storageClassName: "" # empty = cluster default

# Normally inherited from the umbrella chart; set here so the chart also
# renders when installed on its own.
global:
  ingress:
    className: traefik

ingress:
  host: store.local.test
  tls: false # true on the VPS: WordPress then trusts X-Forwarded-Proto from Traefik
  tlsSecretName: ""
  annotations: {}

site:
  title: Urumi Demo Store
  country: "US:CA"
  currency: USD

mysql:
  image: mysql:8.4.11
  database: wordpress
  user: wordpress
  storage: 2Gi
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { cpu: "1", memory: 1Gi }

wordpress:
  image: wordpress:7.1.3-php8.3-apache
  storage: 2Gi
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

bootstrap:
  image: wordpress:cli-2.12.0-php8.3
  woocommerceVersion: 11.2.1
  seedProducts: true
  timeoutSeconds: 900
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

woocommerceMcp:
  enabled: true
  image: mcp-gateway/woocommerce-mcp:dev
  imagePullPolicy: IfNotPresent
  port: 3000
  wcTimeoutMs: 8000
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
