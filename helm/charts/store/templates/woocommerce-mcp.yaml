{{- if .Values.woocommerceMcp.enabled }}
{{- $name := printf "%s-woocommerce-mcp" (include "store.fullname" .) -}}
# ClusterIP only, and deliberately no Ingress: this server is reachable from
# inside the cluster and nowhere else. Callers also need the bearer token
# from the woocommerce-mcp-auth Secret.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
    {{- include "store.selector" (list . "woocommerce-mcp") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "store.selector" (list . "woocommerce-mcp") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.woocommerceMcp.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
    {{- include "store.selector" (list . "woocommerce-mcp") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "store.selector" (list . "woocommerce-mcp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "store.labels" . | nindent 8 }}
        {{- include "store.selector" (list . "woocommerce-mcp") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the "node" user in node:alpine
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: woocommerce-mcp
          image: {{ .Values.woocommerceMcp.image }}
          imagePullPolicy: {{ .Values.woocommerceMcp.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.woocommerceMcp.port }}
          env:
            - name: PORT
              value: {{ .Values.woocommerceMcp.port | quote }}
            - name: WC_BASE_URL
              value: {{ include "store.wordpressInternalUrl" . | quote }}
            # WooCommerce rebuilds the OAuth signature from its own home URL,
            # with http:// because these in-cluster requests aren't TLS - so we
            # sign against that, not against the Service URL we connect to.
            - name: WC_SIGNING_URL
              value: {{ printf "http://%s" .Values.ingress.host | quote }}
            - name: WC_TIMEOUT_MS
              value: {{ .Values.woocommerceMcp.wcTimeoutMs | quote }}
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.wcApi }}
                  key: consumer-key
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.wcApi }}
                  key: consumer-secret
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mcpAuth }}
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Neither probe touches WooCommerce: if the store is down the MCP
          # server should stay up and return clear tool errors, not restart.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.woocommerceMcp.resources | nindent 12 }}
{{- end }}
