{{- $name := printf "%s-wordpress" (include "store.fullname" .) -}}
# Holds the whole WordPress docroot (core, wp-config.php, plugins, uploads).
# The official image copies WordPress core into an empty /var/www/html on
# first start, and the bootstrap Job mounts this same volume to run WP-CLI.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  annotations:
    # Survive `helm uninstall`, like the MySQL StatefulSet's PVC does - losing
    # only one half of the store (files but not DB) would leave it broken.
    helm.sh/resource-policy: keep
  labels:
    {{- include "store.labels" . | nindent 4 }}
    {{- include "store.selector" (list . "wordpress") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.wordpress.storage }}
---
# Apache listens on 8080 so the container can run as a non-root user (ports
# below 1024 need root). The Service still exposes 80. Both files replace the
# image's copies, changing only the port.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-apache
  labels:
    {{- include "store.labels" . | nindent 4 }}
    {{- include "store.selector" (list . "wordpress") | nindent 4 }}
data:
  ports.conf: |
    Listen 8080
  000-default.conf: |
    <VirtualHost *:8080>
        ServerAdmin webmaster@localhost
        DocumentRoot /var/www/html
        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
    </VirtualHost>
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
    {{- include "store.selector" (list . "wordpress") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "store.selector" (list . "wordpress") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
    {{- include "store.selector" (list . "wordpress") | nindent 4 }}
spec:
  replicas: 1
  # The volume is ReadWriteOnce: a rolling update would start the new pod
  # while the old one still holds it. Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "store.selector" (list . "wordpress") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "store.labels" . | nindent 8 }}
        {{- include "store.selector" (list . "wordpress") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # uid 33 = www-data in the Debian-based image, which already owns the
        # files on the volume (the bootstrap Job runs as 33 too).
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "store.wordpressEnv" . | nindent 12 }}
          # First start copies WordPress core onto the volume: give it time.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          # Any 2xx/3xx counts: before install wp-login.php redirects to the
          # installer, which still proves Apache + PHP + DB connection work.
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # Liveness only checks Apache is accepting connections, so a slow PHP
          # page or a DB blip makes the pod unready rather than restart-looping.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          volumeMounts:
            - name: html
              mountPath: /var/www/html
            - name: apache-conf
              mountPath: /etc/apache2/ports.conf
              subPath: ports.conf
              readOnly: true
            - name: apache-conf
              mountPath: /etc/apache2/sites-enabled/000-default.conf
              subPath: 000-default.conf
              readOnly: true
            # Apache's pid file, lock files and PHP's temp files: the rest of
            # the filesystem is read-only.
            - name: run
              mountPath: /var/run/apache2
            - name: lock
              mountPath: /var/lock/apache2
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: {{ $name }}
        - name: apache-conf
          configMap:
            name: {{ $name }}-apache
        - name: run
          emptyDir: {}
        - name: lock
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
    {{- include "store.selector" (list . "wordpress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingress.className | default "traefik" }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName | default (printf "%s-tls" $name) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
