{{- $name := include "gateway.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.selector" (list . "gateway") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "gateway.selector" (list . "gateway") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.selector" (list . "gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "gateway.selector" (list . "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gateway.labels" . | nindent 8 }}
        {{- include "gateway.selector" (list . "gateway") | nindent 8 }}
        # Lets this pod through the woocommerce-mcp NetworkPolicy.
        {{ .Values.global.mcpClientLabel }}: "true"
    spec:
      # The only pod with a ServiceAccount token: it reads and writes upstream
      # credentials as Secrets in {{ .Values.upstreamSecrets.namespace }} (see rbac.yaml).
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the "node" user in node:alpine
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: {{ .Values.gateway.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          env:
            - name: PORT
              value: {{ .Values.gateway.port | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.db }}
                  key: password
            # $(DB_PASSWORD) is expanded by the kubelet from the variable above,
            # so the password stays in the Secret, not in the pod spec. It's
            # hex, so it needs no URL escaping.
            - name: DATABASE_URL
              value: {{ printf "postgres://%s:$(DB_PASSWORD)@%s-postgres:5432/%s" .Values.postgres.user $name .Values.postgres.database | quote }}
            - name: HEALTH_INTERVAL_MS
              value: {{ .Values.gateway.healthIntervalMs | quote }}
            - name: METRICS_ENABLED
              value: {{ .Values.gateway.metrics.enabled | quote }}
            - name: MEMBER_DEFAULT_POLICY
              value: {{ .Values.gateway.memberDefault | quote }}
            - name: SEARCH_MODE
              value: {{ .Values.gateway.search.mode | quote }}
            - name: CHAT_SEARCH_MODE
              value: {{ .Values.gateway.search.chatMode | quote }}
            - name: SEARCH_AUTO_THRESHOLD
              value: {{ .Values.gateway.search.autoThreshold | quote }}
            - name: UPSTREAM_SECRETS_NAMESPACE
              value: {{ .Values.upstreamSecrets.namespace | quote }}
            - name: SSRF_ALLOWED_HOSTS
              value: {{ join "," .Values.gateway.ssrf.allowedHosts | quote }}
            - name: LIST_TIMEOUT_MS
              value: {{ .Values.gateway.listTimeoutMs | quote }}
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.bootstrapAdmin }}
                  key: email
                  optional: true
            - name: BOOTSTRAP_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.bootstrapAdmin }}
                  key: api-key
                  optional: true
            # Dashboard login for the bootstrap admin, set once on first start.
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.bootstrapAdmin }}
                  key: password
                  optional: true
            # Chat agent. Optional Secret: absent = chat is off (the endpoint
            # answers 503), everything else works.
            - name: CHAT_PROVIDER
              value: {{ .Values.gateway.chat.provider | quote }}
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.groq }}
                  key: api-key
                  optional: true
            - name: GROQ_MODEL
              value: {{ .Values.gateway.chat.groqModel | quote }}
            - name: GROQ_MAX_RESULT_CHARS
              value: {{ .Values.gateway.chat.groqMaxResultChars | quote }}
            - name: GROQ_REASONING_EFFORT
              value: {{ .Values.gateway.chat.groqReasoningEffort | quote }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.gemini }}
                  key: api-key
                  optional: true
            - name: GEMINI_MODEL
              value: {{ .Values.gateway.chat.model | quote }}
            - name: CHAT_MAX_STEPS
              value: {{ .Values.gateway.chat.maxSteps | quote }}
            - name: CHAT_TURN_TIMEOUT_MS
              value: {{ .Values.gateway.chat.turnTimeoutMs | quote }}
            - name: CHAT_TURNS_PER_MINUTE
              value: {{ .Values.gateway.chat.turnsPerMinute | quote }}
            - name: CHAT_CONFIRM_WRITES
              value: {{ .Values.gateway.chat.confirmWrites | quote }}
            - name: PUBLIC_MCP_URL
              value: {{ include "gateway.publicMcpUrl" . | quote }}
            {{- with .Values.dashboardUrl }}
            - name: DASHBOARD_URL
              value: {{ . | quote }}
            - name: COOKIE_SECURE
              value: {{ hasPrefix "https://" . | quote }}
            {{- end }}
            {{- if .Values.seedWoocommerce.enabled }}
            - name: SEED_WOOCOMMERCE_URL
              value: {{ include "gateway.woocommerceUrl" . | quote }}
            - name: SEED_WOOCOMMERCE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.seedWoocommerce.tokenSecret }}
                  key: token
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # SIGTERM and removal from the Service's endpoints happen at the same
          # time, and Traefik / kube-proxy learn about the removal a moment
          # later. Keep serving for a few seconds first, so requests already
          # routed here don't get refused or hang mid-rollout.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # Migrations + seeding run before the server listens.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          # Ready = can reach Postgres. Never depends on upstreams: a dead MCP
          # server must not take the gateway out of the Service.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.selector" (list . "gateway") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingress.className | default "traefik" }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName | default (printf "%s-tls" $name) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # /mcp for MCP clients, /api for scripts and admin tooling (the
          # dashboard reaches /api through its own host), /healthz for uptime checks.
          {{- range list "/mcp" "/api" "/healthz" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
          {{- end }}
{{- if and .Values.gateway.metrics.enabled .Values.gateway.metrics.serviceMonitor.enabled }}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- with .Values.gateway.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "gateway.selector" (list . "gateway") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.gateway.metrics.serviceMonitor.interval }}
{{- else }}
# gateway.metrics.serviceMonitor.enabled is set but the cluster has no
# monitoring.coreos.com/v1 API (Prometheus Operator), so no ServiceMonitor is rendered.
{{- end }}
{{- end }}
