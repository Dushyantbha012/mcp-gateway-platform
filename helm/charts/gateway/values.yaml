# Defaults for the gateway. Environment-specific values (ingress host,
# storage class, image) are set from the umbrella chart's values-local.yaml /
# values-prod.yaml under the `gateway:` key.

# Created ahead of time by scripts/create-secrets.sh, never by this chart, so
# `helm uninstall` can't delete the DB password or the key that decrypts the
# stored upstream credentials. These are the Secret names.
secrets:
  db: gateway-db # keys: password
  bootstrapAdmin: gateway-bootstrap-admin # keys: email, api-key, password (optional Secret)
  # API keys for the chat agent (optional Secrets: with neither, chat is
  # switched off and the rest of the gateway is unaffected; with both, users
  # can switch between the two in the chat page).
  groq: gateway-groq # keys: api-key
  gemini: gateway-gemini # keys: api-key

# Upstream servers' credentials (GitHub token, ...) are stored as Kubernetes
# Secrets, one per server, in this namespace. Created ahead of time by
# scripts/create-secrets.sh (it also labels it for restricted Pod Security).
upstreamSecrets:
  namespace: urumi-upstreams

storageClassName: "" # empty = cluster default

# Normally inherited from the umbrella chart; set here so the chart also
# renders when installed on its own.
global:
  ingress:
    className: traefik
  # Pods carrying this label may call MCP servers that only accept the
  # gateway (see the store chart's woocommerce-mcp NetworkPolicy).
  mcpClientLabel: urumi.ai/mcp-client

ingress:
  host: gateway.local.test
  tls: false
  tlsSecretName: ""
  annotations: {}

# Public URL of the dashboard (from the umbrella values). Builds invite links,
# is the only Origin allowed to make cookie-authenticated changes (CSRF
# check), and an https:// URL turns on the Secure cookie flag.
dashboardUrl: ""
# What members are told to point their MCP client at. Empty = this chart's
# Ingress host + /mcp.
publicMcpUrl: ""

gateway:
  image: mcp-gateway/gateway:dev
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  healthIntervalMs: 15000
  listTimeoutMs: 5000
  # What a member may use when no permission rule matches: "readOnly" = only
  # tools the upstream marks readOnlyHint (admins Allow the rest, per user or
  # for all members), "allowAll" = everything until a Deny rule says otherwise.
  memberDefault: readOnly
  approvals:
    # Hold every write (a tool without readOnlyHint) that an MCP client calls until
    # its user approves it on the dashboard's Approvals page; the client retries.
    # Applies to admins too. The chat agent has its own prompt (chat.confirmWrites).
    mcpWrites: true
  # Prometheus metrics at GET /metrics on the app port. Never on the Ingress;
  # allow a scraper in with global.networkPolicy.metricsScrape.
  # Search-then-execute: expose only search_tools + call_tool, so a client with
  # hundreds of tools doesn't fill its context. off | on | auto (meta-tools only
  # once a caller can see more than autoThreshold tools). MCP clients can
  # override per request with /mcp?mode=search|full. chatMode is the same
  # choice for the dashboard's chat agent.
  search:
    mode: "off"
    chatMode: "off"
    autoThreshold: 50
  metrics:
    enabled: true
    # Needs the Prometheus Operator CRDs (monitoring.coreos.com/v1); skipped
    # with a notice in the render if they are missing.
    serviceMonitor:
      enabled: false
      interval: 30s
      # Extra labels, e.g. the "release: kube-prometheus-stack" your Prometheus selects on.
      labels: {}
  chat:
    # The model a chat uses unless the user picks the other: groq | gemini.
    # If the chosen one has no API key Secret, the other is used.
    provider: groq
    # Groq (default). openai/gpt-oss-120b supports tool calling; reasoningEffort
    # (low | medium | high | "" to not send) applies to gpt-oss models only.
    groqModel: openai/gpt-oss-120b
    groqReasoningEffort: low
    # Groq's free tier is ~8000 tokens/minute: cut each tool result fed back to the
    # model to this many characters (~4 per token).
    groqMaxResultChars: 4000
    # Gemini. Free-tier quotas: Flash models ~20 requests/day, Flash Lite ~500/day;
    # each chat turn costs one request per model step.
    model: gemini-3.5-flash-lite
    maxSteps: 8
    turnTimeoutMs: 90000
    turnsPerMinute: 6
    # The chat agent stops and asks the user before running a tool that changes data
    # (anything an upstream doesn't mark read-only). The user approves in the dashboard.
    confirmWrites: true
  # SSRF guard: upstream URLs must resolve to public addresses. Hostnames
  # listed here (exact match) may resolve to private ones - for in-cluster MCP
  # servers. The seeded WooCommerce server's host is allowed automatically.
  # Deliberately Helm-only: nothing in the dashboard or API can widen it.
  ssrf:
    allowedHosts: []
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 384Mi }

# Registers the store's WooCommerce MCP server as upstream #1 on first start
# (only if no server with slug "woocommerce" exists yet).
seedWoocommerce:
  enabled: true
  # Empty = the store subchart's in-cluster Service in this release.
  url: ""
  tokenSecret: woocommerce-mcp-auth # key: token
  # Its public storefront URL, shown on the Stores page (e.g. http://store.local.test).
  storeUrl: ""

# Multi-store: any user can create up to maxPerUser WooCommerce stores from the
# dashboard. A separate provisioner Deployment (same image) builds each one in
# a namespace of its own - store-<slug>, served at <slug>.<template.baseDomain> -
# and registers its MCP server with the gateway. Off = no provisioner and no
# cluster-wide RBAC; the Stores page only lists the Helm-installed store.
# Hosted MCP servers: admins run a container image as an MCP server, one
# namespace each, built by the provisioner (needs stores.enabled for the
# provisioner pod). Images are untrusted code, so only these repositories may
# be used - prefixes ending in "/" ("docker.io/mcp/") or exact repositories -
# and never by ":latest".
hosted:
  enabled: false
  imageAllowlist:
    - docker.io/mcp/
  # Not ready after this long = failed, with the pod's reason (ImagePullBackOff...).
  timeoutSeconds: 600
  imagePullPolicy: IfNotPresent
  # The stdio bridge (mcp-bridge/), copied into each stdio server's pod.
  bridge:
    image: mcp-gateway/mcp-bridge:dev
    imagePullPolicy: IfNotPresent

stores:
  enabled: false
  maxPerUser: 2
  # A store still not ready after this long is marked failed (with the step it
  # was stuck at); its owner can retry it.
  timeoutSeconds: 900
  provisioner:
    image: "" # empty = gateway.gateway.image (the provisioner ships in it)
    # Stores worked on at once (each is mostly waiting on pods).
    concurrency: 3
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 250m, memory: 192Mi }
  # Everything a provisioned store is built from, passed to the provisioner as
  # JSON. Every key is optional; defaults (gateway/src/provisioner/template.ts)
  # match the store subchart: same images, probes and security contexts, with
  # 1Gi volumes and a tight per-store ResourceQuota. The gateway namespace, MCP
  # client label, ingress controller and private ranges come from the release.
  template:
    baseDomain: store.local.test
    tls: false
    ingressAnnotations: {}
    storageClassName: ""
    # quota: { requestsCpu: "1", requestsMemory: 1536Mi, limitsCpu: "3", limitsMemory: 3Gi, pods: 8, pvcs: 2, storage: 3Gi }
    # woocommerceMcp: { image: ..., imagePullPolicy: IfNotPresent }

postgres:
  image: postgres:16.11-alpine
  database: gateway
  user: gateway
  storage: 1Gi
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 384Mi }
