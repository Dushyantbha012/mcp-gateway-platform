# Overrides for the production-like VPS (k3s). Real domain, TLS and storage
# class are placeholders here. A working single-node variant (sslip.io hostnames,
# images imported into k3s) is generated by deploy/ec2/deploy.sh.
# The k3s server must be installed with --secrets-encryption so Secrets are
# encrypted at rest (check: scripts/verify-encryption.sh).
global:
  networkPolicy:
    # The k3s node's IP where the API server listens (kubectl get endpoints
    # kubernetes). CHANGE_ME: this is a documentation-range placeholder.
    apiServerCidr: 203.0.113.10/32

store:
  ingress:
    host: store.CHANGE_ME.example
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
  storageClassName: local-path # k3s default; change if the VPS uses something else
  woocommerceMcp:
    # Pulled from a registry on the VPS instead of `k3d image import`.
    image: ghcr.io/CHANGE_ME/woocommerce-mcp:0.2.0

gateway:
  ingress:
    host: gateway.CHANGE_ME.example
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
  storageClassName: local-path
  gateway:
    image: ghcr.io/CHANGE_ME/gateway:0.4.0
  # https:// -> the session cookie also gets the Secure flag.
  dashboardUrl: https://dashboard.CHANGE_ME.example
  seedWoocommerce:
    storeUrl: https://store.CHANGE_ME.example
  # Multi-store. Needs a wildcard DNS record *.stores.<domain> -> the
  # VPS; cert-manager then issues one certificate per store (HTTP-01).
  stores:
    enabled: true
    template:
      baseDomain: stores.change-me.example # CHANGE_ME (lowercase: it becomes hostnames)
      tls: true
      ingressAnnotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      storageClassName: local-path
      woocommerceMcp:
        image: ghcr.io/CHANGE_ME/woocommerce-mcp:0.2.0
        imagePullPolicy: IfNotPresent
  # OAuth for MCP clients, including claude.ai custom connectors.
  oauth:
    enabled: true

dashboard:
  ingress:
    host: dashboard.CHANGE_ME.example
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
  image: ghcr.io/CHANGE_ME/dashboard:0.4.0
