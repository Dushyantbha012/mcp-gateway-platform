# Included in every location: nginx drops a parent's add_header lines as
# soon as a location has any of its own, so they can't live at server level.
#
# CSP: everything from this origin only - the app makes no third-party
# requests (fonts are bundled). 'unsafe-inline' for styles only, which Radix
# needs for positioning popovers; scripts stay 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# The invite page's URL carries a one-time token; never leak it in a Referer.
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
