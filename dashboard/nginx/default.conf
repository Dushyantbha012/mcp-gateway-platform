# Serves the dashboard's static build. /api never gets here: the Ingress
# routes it to the gateway (same origin for the browser).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fail loudly if the Ingress ever stops routing /api to the gateway,
    # instead of answering API calls with index.html.
    location /api/ {
        return 404;
    }

    # Vite puts a content hash in every asset name, so they can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes (/servers, /invite/<token>, ...) all get index.html,
    # which must never be cached so a new release is picked up at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
